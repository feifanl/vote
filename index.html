<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <title>Vote</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="voter.js"></script>
  </head>
  <body>
    <main class="voter">
      <div class="voter__round num" id="round">&nbsp;</div>

      <div class="voter__main">
        <div class="voter__value num is-unset" id="value" aria-hidden="true">–</div>

        <div
          class="slider is-unset"
          id="slider"
          role="slider"
          tabindex="0"
          aria-label="Agreement, 0 to 10"
          aria-valuemin="0"
          aria-valuemax="10"
          aria-disabled="true"
        >
          <div class="slider__track"></div>
          <div class="slider__fill"></div>
          <div class="slider__ticks">
            <span></span><span></span><span></span><span></span><span></span><span></span
            ><span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="slider__thumb"></div>
        </div>

        <div class="scale">
          <span>0<small>disagree</small></span>
          <span>10<small>agree</small></span>
        </div>
      </div>

      <p class="voter__status" id="status" role="status" aria-live="polite">Connecting…</p>
    </main>
  </body>
</html>
